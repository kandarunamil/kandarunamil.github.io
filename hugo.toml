languageCode = "th-TH"
defaultContentLanguage = "th"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
timeout = "30s"

[frontmatter]
  lastmod = ["lastmod", ":git", "date", "publishDate"]

[outputs]
