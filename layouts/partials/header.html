<header class="site-header">
  <div class="container bar">
    <a class="brand" href="{{ "/" | relURL }}">{{ site.Title }}</a>
    <button class="burger" type="button" aria-label="เปิดเมนู" aria-expanded="false" aria-controls="menu">
      <span></span><span></span>
    </button>
    <nav id="menu" class="menu" aria-label="เมนูหลัก">
      <ul>
        {{- range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
  </div>
</header>
