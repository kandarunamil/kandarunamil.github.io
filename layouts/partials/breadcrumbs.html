{{ if not .IsHome }}
{{ $crumbs := partial "crumbs.html" . }}
<nav class="crumbs" aria-label="breadcrumb">
  <ol>
    {{- range $i, $c := $crumbs }}
    {{- if eq (add $i 1) (len $crumbs) }}
    <li aria-current="page">{{ $c.name }}</li>
    {{- else }}
    <li><a href="{{ $c.url }}">{{ $c.name }}</a></li>
    {{- end }}
    {{- end }}
  </ol>
</nav>
{{ end }}
